name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'www/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'www/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run size
